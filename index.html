<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB-TOOLKITS // 網頁嵌入式模組工具庫</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            black: '#0a0a0f',
                            card: '#12131c',
                            border: '#1f2438',
                            accent: '#6366f1',
                            neon: '#10b981'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .grid-bg {
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
        }
    </style>
</head>
<body class="bg-cyber-black text-slate-100 min-h-screen grid-bg font-sans flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="border-b border-cyber-border bg-cyber-card/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-black">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <span class="font-black text-lg tracking-wider text-slate-100">WEB-TOOLKITS<span class="text-indigo-500">.JS</span></span>
            </div>
            <div class="flex items-center gap-4 text-xs font-mono">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-950 text-emerald-400 border border-emerald-800">
                    ● AUTO DISCOVERY ONLINE
                </span>
            </div>
        </div>
    </header>

    <!-- Main Hero & Module Catalog -->
    <main class="max-w-7xl mx-auto px-6 py-12 flex-1 w-full flex flex-col gap-10">
        
        <!-- Hero Section -->
        <div class="text-center py-8 border-b border-cyber-border">
            <h1 class="text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-500 mb-4">
                開箱即用的輕量 Web 模組集合
            </h1>
            <p class="text-slate-400 max-w-2xl mx-auto text-sm md:text-base">
                輕量級模組，您只需在任何 HTML 頁面載入一行 `&lt;script&gt;`，即可為網頁注入互動組件。
            </p>
        </div>

        <!-- Toolkits Catalog Section -->
        <div>
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xs font-mono font-bold tracking-widest text-indigo-400 uppercase flex items-center gap-2">
                    <i class="fa-solid fa-layer-group"></i> 模組目錄 (MODULE CATALOG)
                </h2>
                <span id="module-count" class="text-xs font-mono text-slate-500">掃描模組中...</span>
            </div>

            <!-- Dynamic Modules Grid -->
            <div id="modules-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- 動態注入模組卡片 -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-cyber-border py-6 text-center text-xs text-slate-500 font-mono">
        <p>© 2026 WEB-TOOLKITS ENGINE // OPEN SOURCE MIT LICENSE</p>
    </footer>

    <!-- Auto Discovery & Rendering Script -->
    <script>
        // 本地靜態備援清單
        const fallbackModules = ["dice-roller", "card-clash"];

        // 圖示與備援描述對照表
        const moduleMeta = {
            "dice-roller": {
                name: "2D Toon 3D Dice Roller",
                icon: "fa-dice-d6"
            },
            "card-clash": {
                name: "Card Clash Animation",
                icon: "fa-wand-magic-sparkles"
            }
        };

        // 簡單解析 Markdown 取得第一段描述文字
        function parseMarkdownDescription(mdText) {
            if (!mdText) return "載入模組說明中...";
            const lines = mdText.split('\n');
            for (let line of lines) {
                line = line.trim();
                // 略過標題行 (# 開頭) 與空行
                if (line && !line.startsWith('#') && !line.startsWith('---') && !line.startsWith('```')) {
                    // 去除 markdown 粗體標記等
                    return line.replace(/[*_`]/g, '').substring(0, 85) + '...';
                }
            }
            return "開箱即用的 Web 互動小工具模組。";
        }

        async function initPortal() {
            const gridContainer = document.getElementById('modules-grid');
            const countLabel = document.getElementById('module-count');

            let rawModules = [];

            try {
                const res = await fetch('./modules.json');
                if (res.ok) {
                    const data = await res.json();
                    rawModules = data.modules || [];
                } else {
                    throw new Error('modules.json fetch failed.');
                }
            } catch (err) {
                console.warn('使用 Fallback 模組陣列:', err);
                rawModules = fallbackModules;
            }

            countLabel.textContent = `共載入 ${rawModules.length} 個模組`;
            gridContainer.innerHTML = '';

            for (let index = 0; index < rawModules.length; index++) {
                const modId = rawModules[index];
                const numStr = String(index + 1).padStart(2, '0');
                const meta = moduleMeta[modId] || {
                    name: modId.toUpperCase(),
                    icon: 'fa-cube'
                };

                const targetUrl = `./modules/${modId}/${modId}.html`;
                const scriptCdnUrl = `modules/${modId}/${modId}.js`;

                // 嘗試讀取 modules/{modId}/README.md
                let description = "載入模組說明中...";
                try {
                    const mdRes = await fetch(`./modules/${modId}/${modId}.md`);
                    if (mdRes.ok) {
                        const mdText = await mdRes.text();
                        description = parseMarkdownDescription(mdText);
                    } else {
                        description = "暫無詳細說明文件。";
                    }
                } catch (e) {
                    description = "暫無詳細說明文件。";
                }

                const cardHtml = `
                    <div class="bg-cyber-card border border-cyber-border hover:border-indigo-500/50 rounded-2xl p-6 flex flex-col justify-between gap-6 transition group">
                        <div>
                            <div class="flex justify-between items-start mb-4">
                                <span class="text-xs font-mono text-emerald-400 bg-emerald-950/60 px-2 py-1 rounded border border-emerald-800">#${numStr} MODULE</span>
                                <i class="fa-solid ${meta.icon} text-2xl text-indigo-400 group-hover:rotate-12 transition transform"></i>
                            </div>
                            <h3 class="text-xl font-bold text-white mb-2">${meta.name}</h3>
                            <p class="text-slate-400 text-xs leading-relaxed mb-4">
                                ${description}
                            </p>
                        </div>

                        <div class="space-y-3">
                            <a href="${targetUrl}" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 px-4 rounded-xl text-xs transition flex items-center justify-center gap-2 block text-center">
                                <i class="fa-solid fa-arrow-right"></i> 前往預覽頁 (${modId}.html)
                            </a>
                            <div class="bg-cyber-black p-3.5 rounded-xl border border-cyber-border font-mono text-[10px] text-slate-400 overflow-x-auto">
                                <code>&lt;script src="${scriptCdnUrl}"&gt;&lt;/script&gt;</code>
                            </div>
                        </div>
                    </div>
                `;
                gridContainer.innerHTML += cardHtml;
            }
        }

        document.addEventListener('DOMContentLoaded', initPortal);
    </script>
</body>
</html>
