<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roller Module Preview // WEB-TOOLKITS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 依賴庫 (Three.js, Cannon.js, Tone.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- 本模組 Core JS -->
    <script src="./dice-roller.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            black: '#0a0a0f',
                            card: '#12131c',
                            border: '#1f2438',
                            accent: '#6366f1'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cyber-black text-slate-100 min-h-screen font-sans flex flex-col justify-between">

    <!-- Header / Nav -->
    <header class="border-b border-cyber-border bg-cyber-card/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="../../index.html" class="text-slate-400 hover:text-white transition flex items-center gap-2 text-sm font-mono">
                    <i class="fa-solid fa-arrow-left"></i> [返回主頁 PORTAL]
                </a>
                <span class="text-slate-600">/</span>
                <span class="font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-dice-d6 text-indigo-400"></i> MODULE 01: DICE-ROLLER
                </span>
            </div>
            <span class="text-xs font-mono bg-emerald-950 text-emerald-400 px-2.5 py-1 rounded border border-emerald-800">
                ● DEMO PAGE
            </span>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto px-6 py-12 flex-1 w-full flex flex-col gap-8">
        
        <div class="border-b border-cyber-border pb-6">
            <h1 class="text-3xl font-black text-white mb-2 flex items-center gap-3">
                🎲 2D Toon 3D Dice Roller
            </h1>
            <p class="text-slate-400 text-sm">
                本頁面為 <code class="text-indigo-400">modules/dice-roller/</code> 的單獨展示與調試控制台。
            </p>
        </div>

        <!-- Interactive Control Panel -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Quick Preset Roll Options -->
            <div class="bg-cyber-card border border-cyber-border rounded-2xl p-6 flex flex-col gap-4">
                <h2 class="text-xs font-mono font-bold text-indigo-400 tracking-wider uppercase flex items-center gap-2">
                    <i class="fa-solid fa-bolt"></i> 快速預設測試 (Quick Presets)
                </h2>
                
                <button onclick="DiceRoller.open(1)" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-xl text-sm transition flex items-center justify-between">
                    <span>1D6 (預設 1~6 點)</span>
                    <i class="fa-solid fa-play text-xs"></i>
                </button>

                <button onclick="DiceRoller.open(1, [2,2,2,4,4,4], onResult)" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 px-4 rounded-xl text-sm transition flex items-center justify-between">
                    <span>1D6 (自訂骰面: 2, 2, 2, 4, 4, 4)</span>
                    <i class="fa-solid fa-play text-xs"></i>
                </button>

                <button onclick="DiceRoller.open({ title: '2D6 雙骰對撞', count: 2, faces: [1,2,3,4,5,6], renderStyle: 0, onComplete: onResult })" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl text-sm transition flex items-center justify-between">
                    <span>2D6 (雙骰卡通碰撞)</span>
                    <i class="fa-solid fa-play text-xs"></i>
                </button>

                <button onclick="DiceRoller.open({ title: '真實風格塑膠骰', count: 1, renderStyle: 2, onComplete: onResult })" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 px-4 rounded-xl text-sm transition flex items-center justify-between">
                    <span>1D6 (真實 3D 亮面塑膠風格)</span>
                    <i class="fa-solid fa-play text-xs"></i>
                </button>
            </div>

            <!-- Output Log Console -->
            <div class="bg-cyber-card border border-cyber-border rounded-2xl p-6 flex flex-col justify-between gap-4">
                <h2 class="text-xs font-mono font-bold text-emerald-400 tracking-wider uppercase flex items-center gap-2">
                    <i class="fa-solid fa-terminal"></i> 回傳結果日誌 (Callback Output)
                </h2>

                <div id="demo-log" class="bg-cyber-black border border-cyber-border rounded-xl p-4 font-mono text-xs text-emerald-400 h-48 overflow-y-auto leading-relaxed">
                    > 等待觸發投擲...
                </div>

                <button onclick="clearLog()" class="text-xs text-slate-500 hover:text-slate-300 transition text-right">
                    清空日誌 [Clear]
                </button>
            </div>

        </div>

    </main>

    <footer class="border-t border-cyber-border py-6 text-center text-xs text-slate-500 font-mono">
        WEB-TOOLKITS // MODULES / DICE-ROLLER
    </footer>

    <script>
        function onResult(res) {
            const log = document.getElementById('demo-log');
            log.innerHTML += `<br>> [${new Date().toLocaleTimeString()}] ${res.title} -> 點數: [${res.results.join(', ')}] (總和: ${res.total})`;
            log.scrollTop = log.scrollHeight;
        }

        function clearLog() {
            document.getElementById('demo-log').innerHTML = '> 等待觸發投擲...';
        }
    </script>
</body>
</html>
