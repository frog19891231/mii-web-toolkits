<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CardClash - Web-Toolkits Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Outfit:wght@600;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Outfit', sans-serif; background: #0f172a; }
    .bangers { font-family: 'Bangers', cursive; }
    .toon-card {
      background: #ffffff;
      border: 4px solid #000000;
      box-shadow: 8px 8px 0px #000000;
      border-radius: 20px;
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col items-center justify-between p-6">

  <!-- Header -->
  <header class="w-full max-w-4xl flex justify-between items-center py-4 border-b border-slate-800">
    <div class="flex items-center gap-3">
      <span class="text-3xl">⚔️</span>
      <div>
        <h1 class="text-2xl font-black tracking-tight text-amber-400">CardClash</h1>
        <p class="text-xs text-slate-400">web-toolkits / modules / card-clash</p>
      </div>
    </div>
    <a href="../../index.html" class="bg-slate-800 hover:bg-slate-700 text-amber-400 text-xs font-bold px-4 py-2 rounded-xl border-2 border-slate-700 transition-all">
      🏠 返回主頁 Portal
    </a>
  </header>

  <!-- Main Box -->
  <main class="w-full max-w-xl my-auto flex flex-col items-center toon-card text-slate-900 p-8 my-8">
    <div class="bangers text-5xl tracking-wide text-amber-500 mb-2">CARD CLASH MODULE</div>
    <p class="text-sm text-slate-600 font-bold text-center mb-6">
      2D 美漫卡通手繪風卡牌對撞動畫模組 (IIFE 標準 API 封裝)
    </p>

    <!-- Controls -->
    <div class="w-full flex flex-col gap-3">
      <button onclick="launchDefaultClash()" class="w-full bg-amber-400 hover:bg-amber-300 text-black font-black py-3 rounded-2xl border-4 border-black shadow-[4px_4px_0px_#000] active:translate-x-1 active:translate-y-1 active:shadow-none transition-all text-lg cursor-pointer">
        ⚔️ 啟動預設對戰 (Launch Default)
      </button>

      <button onclick="launchCustomClash()" class="w-full bg-indigo-400 hover:bg-indigo-300 text-black font-black py-3 rounded-2xl border-4 border-black shadow-[4px_4px_0px_#000] active:translate-x-1 active:translate-y-1 active:shadow-none transition-all text-lg cursor-pointer">
        🐲 啟動 BOSS 討伐戰 (Auto Mode)
      </button>
    </div>

    <!-- Event Log -->
    <div class="w-full mt-6">
      <div class="text-xs font-black text-slate-400 mb-2 uppercase tracking-wider">EVENT LOG (Callback Monitor)</div>
      <div id="demo-log" class="w-full h-28 bg-slate-950 text-emerald-400 font-mono text-xs p-3 rounded-xl border-2 border-slate-800 overflow-y-auto leading-relaxed">
        [System] 模組預覽頁面準備就緒...<br/>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-xs text-slate-500 font-bold">
    Web-Toolkits Module Standard &copy; 2026
  </footer>

  <!-- 載入模組主程式 -->
  <script src="card-clash.js"></script>

  <script>
    function logMsg(msg) {
      const logEl = document.getElementById('demo-log');
      if (logEl) {
        logEl.innerHTML += `${msg}<br/>`;
        logEl.scrollTop = logEl.scrollHeight;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (window.CardClash) {
        logMsg('[System] window.CardClash 載入成功！');
      } else {
        logMsg('[Error] 找不到 window.CardClash。');
      }
    });

    function launchDefaultClash() {
      if (!window.CardClash) return;
      logMsg('[Action] 開啟預設對戰...');
      window.CardClash.open({
        title: 'HERO VS ORC',
        player: { name: '勇者', icon: '⚔️', hp: 35, maxHp: 35, atk: 9, def: 2, color: '#ff4757' },
        enemy: { name: '半獸人', icon: '👺', hp: 30, maxHp: 30, atk: 7, def: 1, color: '#2ed573' },
        onImpact: (data) => logMsg(`[Impact] 勇者 -${data.playerDmg} HP | 怪物 -${data.enemyDmg} HP`),
        onComplete: (res) => logMsg(`[Complete] 勝者: ${res.winner ? res.winner.toUpperCase() : 'DRAW'}`)
      });
    }

    function launchCustomClash() {
      if (!window.CardClash) return;
      logMsg('[Action] 開啟 BOSS 自動討伐戰...');
      window.CardClash.open({
        title: 'EPIC DRAGON RAID',
        player: { name: '聖騎士', icon: '🛡️', hp: 50, maxHp: 50, atk: 12, def: 4, color: '#70a1ff' },
        enemy: { name: '遠古巨龍', icon: '🐲', hp: 60, maxHp: 60, atk: 14, def: 3, color: '#ff6b81' },
        autoPlay: true,
        autoInterval: 700,
        onImpact: (data) => logMsg(`[Impact] 聖騎士 HP: ${data.player.hp} | 巨龍 HP: ${data.enemy.hp}`),
        onComplete: (res) => logMsg(`[Complete] 討伐戰結束！勝者: ${res.winner}`)
      });
    }
  </script>
</body>
</html>
